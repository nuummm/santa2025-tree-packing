[project]
name = "treepack"
version = "0.1.0"
description = "From-scratch Numba solver for packing 1-200 Christmas-tree polygons into the smallest square (Kaggle Santa 2025)."
readme = "README.md"
license = "MIT"
authors = [{ name = "Kensei Nosaka" }]
requires-python = ">=3.11,<3.13"
dependencies = [
    "numba>=0.60",
    "numpy>=1.26",
    "shapely>=2.0",
]

[project.scripts]
treepack = "treepack.cli:main"

[dependency-groups]
dev = [
    "matplotlib>=3.8",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/treepack"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.ruff.lint.per-file-ignores]
# Numba supports the legacy np.random API (seeded inside the jitted function), not Generator.
"src/treepack/anneal.py" = ["NPY002"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running benchmarks and full runs"]
addopts = "-m 'not slow'"
